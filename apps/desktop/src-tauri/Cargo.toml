[package]
name = "cheto-video-ai"
version = "0.2.0"
description = "CHETO VIDEO AI desktop shell"
authors = ["CHETO VIDEO AI contributors"]
edition = "2021"

[lib]
name = "cheto_video_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
